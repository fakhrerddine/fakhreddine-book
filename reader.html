<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d35">
<title>مدرسة العشق الأبدي | فخرالدين حمادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#202638;--gold:#c7a45b;--paper:#fffaf0;--accent:#304b70}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263e61,#0b1425 70%);color:#f8f2e7;font-family:Cairo,Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:26px 14px 18px}header h1{font:700 clamp(2rem,5vw,3.5rem) Amiri,serif;color:#f0d18b;margin:5px}header p{margin:5px;color:#e5dcc9}
.layout{max-width:1180px;margin:auto;padding:12px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
aside,.reader{background:#ffffff0d;border:1px solid #d4b56c55;border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
aside h2{font:700 1.4rem Amiri;color:#f0d18b;margin:0 0 12px}
#toc{display:grid;gap:7px;max-height:70vh;overflow:auto}
#toc button{background:#ffffff0a;color:#f8f2e7;border:1px solid #ffffff20;border-radius:9px;padding:9px;text-align:right;cursor:pointer;font:600 .9rem Cairo}
#toc button[aria-current=true],#toc button:hover{background:#c7a45b;color:#172033}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.toolbar button,.toolbar a{border:1px solid var(--gold);background:#c7a45b;color:#172033;border-radius:9px;padding:9px 14px;font:700 .9rem Cairo;cursor:pointer;text-decoration:none}
.page-wrap{perspective:1400px;min-height:68vh;display:grid;place-items:center}
.page{width:min(100%,760px);min-height:65vh;background:var(--paper);color:var(--ink);border-radius:5px 18px 18px 5px;padding:clamp(22px,5vw,55px);box-shadow:0 18px 55px #0008,inset -8px 0 12px #8b795022;transform-origin:right center;transition:transform .35s,opacity .25s;position:relative;overflow:hidden}
.page.turn{transform:rotateY(-7deg);opacity:.7}
.page h2{font:700 clamp(1.5rem,4vw,2.4rem) Amiri,serif;color:var(--accent);border-bottom:2px solid var(--gold);padding-bottom:12px}
.page p{font:1.1rem/2.2 Amiri,serif;white-space:pre-wrap}
.page img{display:block;max-width:100%;max-height:260px;object-fit:cover;margin:18px auto;border-radius:12px;box-shadow:0 8px 22px #0002}#page.cover img.original-cover-art{max-height:none;max-width:100%;width:100%;height:100%;object-fit:contain;margin:0;border-radius:0;box-shadow:none}
.page-no{position:absolute;bottom:14px;left:22px;color:#887b65;font: .85rem Cairo}
.cover{text-align:center;display:grid;place-items:center;padding:0!important;background:#f8f2e7!important;color:#302719;border:0!important;overflow:hidden}.original-cover-art{display:block!important;width:100%!important;height:100%!important;min-height:65vh!important;max-height:900px!important;max-width:100%!important;object-fit:contain!important;background:#f8f2e7;margin:0!important;border-radius:0!important;box-shadow:none!important}.cover-photo{width:clamp(125px,25vw,190px);height:clamp(125px,25vw,190px);border-radius:50%;object-fit:cover;border:5px solid #e4c77f;box-shadow:0 10px 35px #0008;margin:8px auto 18px}.cover .author{font-weight:700;color:#f1d58e;font-size:1.15rem}.cover .tagline{border-top:1px solid #d5b56d;padding-top:12px;margin-top:10px}
.cover h2{color:#f1d58e;border:0;font-size:clamp(2rem,6vw,3.7rem)}.cover p{color:#fff}
.status{text-align:center;color:#f0d18b;padding:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}#toc{grid-template-columns:repeat(2,minmax(0,1fr));max-height:230px}.page-wrap{min-height:60vh}.page{min-height:58vh}}
@media print{body{background:white;color:black}.layout{display:block}aside,.toolbar,header p{display:none!important}.page{box-shadow:none;border:0;width:100%;min-height:95vh;page-break-after:always;transform:none!important}}
</style>
</head>
<body>
<header><h1>مدرسة العشق الأبدي</h1><p>فلسفة العشق والغرام والهيام</p><p>✦ العشق إلهام، والوفاء رسالة ✦</p><p>بقلم: فخرالدين حمادي</p></header>
<div class="layout">
<aside><h2>فهرس الكتاب</h2><nav id="toc" aria-label="فهرس الفصول"><p>يتم تحميل الفهرس…</p></nav></aside>
<main class="reader">
<div class="toolbar"><button id="prev" type="button">السابق ←</button><button id="next" type="button">→ التالي</button><button id="print" type="button">طباعة / حفظ PDF</button><a href="./book.docx" download>تحميل Word</a></div>
<div class="page-wrap"><article class="page cover" id="page" aria-live="polite"><img class="original-cover-art" src="./gpt_image_e96b07cedfa4411cb8a42d49325a2ae6.png" alt="الغلاف الفني الأصلي لكتاب مدرسة العشق الأبدي"></article></div>
<div class="status" id="status">الغلاف — في انتظار تجهيز نص الفصول من ملف Word الأصلي.</div>
</main></div>
<script>
const page=document.getElementById('page'),toc=document.getElementById('toc'),status=document.getElementById('status');
let chapters=[],current=-1;
const palettes=[['#304b70','#e9d7b0'],['#76523d','#f0dfc5'],['#315b54','#d8e8d9'],['#62466e','#e6d9ef'],['#7b4d39','#f3dfc8'],['#315477','#dce8f4']];
function show(i){if(i< -1||i>=chapters.length)return;current=i;page.classList.add('turn');setTimeout(()=>{page.classList.remove('cover');if(i===-1){page.classList.add('cover');page.innerHTML='<img class="original-cover-art" src="./gpt_image_e96b07cedfa4411cb8a42d49325a2ae6.png" alt="الغلاف الفني الأصلي لكتاب مدرسة العشق الأبدي">';status.textContent='الغلاف';}else{const c=chapters[i],palette=palettes[i%palettes.length];page.style.setProperty('--accent',palette[0]);page.style.background='linear-gradient(135deg,'+palette[1]+',#fffaf0)';page.style.color='#302719';page.innerHTML='<h2></h2><div class="body"></div><span class="page-no"></span>';page.querySelector('h2').textContent=c.title||('الفصل '+(i+1));page.querySelector('.body').textContent=c.text||'سيُضاف نص هذا الفصل من النسخة الأصلية للكتاب.';if(c.image){const img=document.createElement('img');img.src=c.image;img.alt=c.imageAlt||('صورة توضيحية للفصل '+(i+1));page.querySelector('.body').prepend(img);}page.querySelector('.page-no').textContent='صفحة '+(i+1);status.textContent='الفصل '+(i+1)+' من '+chapters.length;}toc.querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-current',String(n===i)));},150);}
async function init(){try{const r=await fetch('./chapters.json');if(!r.ok)throw Error();chapters=await r.json();toc.innerHTML='';chapters.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=c.title||('الفصل '+(i+1));b.addEventListener('click',()=>show(i));toc.append(b);});if(chapters.length){status.textContent='تم تحميل '+chapters.length+' فصلاً.';}else{status.textContent='ملف الفصول فارغ حالياً؛ سنضيف محتوى الكتاب الأصلي.';}}catch(e){toc.innerHTML='<p>الفهرس التفصيلي قيد الإعداد من ملف Word الأصلي.</p>';status.textContent='واجهة القراءة جاهزة؛ الخطوة التالية إدراج نص الفصول والصور المعتمدة.';}}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current+1);if(e.key==='ArrowRight')show(current-1)});init();
</script>
</body></html>
